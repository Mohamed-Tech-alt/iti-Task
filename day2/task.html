<!DOCTYPE html>
<html lang="en">
    <head>
 <meta charset="utf-8">
 <title>MAGIC Pizza</title>

    </head>
<body>
  
  <h1> MAGIC-PIZZA</h1>

<a href="#">menu</a>
<a href="#">About</a>
<a href="#">Login</a>
<a href="#">Contact Us</a>

<p>
    When you Take a Magic Pizaa from menu, you will take another one
</p>
<img src="./image/pizza.jpeg" alt="pizza" width="200" height="300" align="center"

<form>
   <fieldset>
    <legend><h2>Register</h2></legend>

     <label>Name:</label>
            <input type="text" name="name">
            <br><br>
     <label>Email:</label>
            <input type="email" name="email">
            <br><br>
            
        <label>Password:</label>
            <input type="password" name="password">
            <br><br>
            
        <label>Address:</label>
            <input type="text" name="Address">
            <br><br>
            
        <label>Phone:</label>
            <input type="tel" name="Phone">
            <br><br>

   </fieldset>

<h2>Design Your Dream Pizza:</h2>

      <fieldset>
        <legend>Pizza Specs</legend>  

            <h3>Crust (Choose one):</h3>

            <input type="radio"  name="crust" value="classic">
            <label >Classic White</label>
            <br>

            <input type="radio" id="multigrain" name="crust" value="multigrain">
            <label for="multigrain">Multigrain</label>
            <br>

            <input type="radio"  name="crust" value="stuffed">
            <label >Cheese-stuffed Crust</label>
            <br>

            <input type="radio"  name="crust" value="gluten-free">
            <label >Gluten-free</label>

 <h3>Toppings (Choose as many as you want):</h3>

            <input type="checkbox" id="red" name="toppings" value="red-sauce">
            <label for="red">Red Sauce</label>
            <br>

            <input type="checkbox" id="white" name="toppings" value="white-sauce">
            <label for="white">White Sauce</label>
            <br>

            <input type="checkbox" id="mozzarella" name="toppings" value="mozzarella">
            <label for="mozzarella">Mozzarella Cheese</label>
            <br>

            <input type="checkbox" id="pepperoni" name="toppings" value="pepperoni">
            <label for="pepperoni">Pepperoni</label>
            <br>

            <input type="checkbox" id="mushrooms" name="toppings" value="mushrooms">
            <label for="mushrooms">Mushrooms</label>
            <br>

            <input type="checkbox" id="peppers" name="toppings" value="peppers">
            <label for="peppers">Peppers</label>
            <br>

            <input type="checkbox" id="anchovies" name="toppings" value="anchovies">
            <label for="anchovies">Anchovies</label>

  <h3>Amount</h3>

            <label >How many pizzas:</label>
            <input type="number"  name="quantity"
                   min="1" max="10">

        </fieldset>

        <br>

        <input type="submit" value="Bring me a pizza!">
        <input type="reset" value="Reset">



</form>

</body>

</html>
